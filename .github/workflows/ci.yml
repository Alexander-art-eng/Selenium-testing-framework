# Name of the workflow
name: Selenium_testing_framework

# Trigger the workflow on push events to specified branches
on:
  push:
    branches:
      - main  # Specify the branch to trigger the workflow, change if needed
      - develop  # Add any other branches you want to trigger the workflow

# Define the jobs to be run
jobs:
  # Name of the job
  build:
    # Specify the environment for the job
    runs-on: ubuntu-latest

    # List of steps to execute in the job
    steps:
    - name: Checkout code
      # Action to check out the repository code
      uses: actions/checkout@v2

    - name: Set up Node.js
      # Action to set up Node.js environment
      uses: actions/setup-node@v3
      with:
        node-version: '16'  # Specify the Node.js version you need

    - name: Install dependencies
      # Command to install project dependencies
      run: npm install

    - name: Run tests
      # Command to run the test suite
      run: npm test

    - name: Build project
      # Command to build the project
      run: npm run build